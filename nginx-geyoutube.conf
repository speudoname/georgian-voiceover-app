# Nginx configuration for geyoutube.com
# File: /etc/nginx/sites-available/geyoutube.com

upstream geyoutube_backend {
    server 127.0.0.1:5001 fail_timeout=30s max_fails=3;
    keepalive 32;
}

# HTTP redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name geyoutube.com www.geyoutube.com;

    # Let's Encrypt challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name geyoutube.com www.geyoutube.com;

    # SSL certificate paths (will be set by certbot)
    ssl_certificate /etc/letsencrypt/live/geyoutube.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geyoutube.com/privkey.pem;

    # SSL configuration (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logs
    access_log /var/log/nginx/geyoutube-access.log;
    error_log /var/log/nginx/geyoutube-error.log warn;

    # Max upload size (for video uploads if needed)
    client_max_body_size 500M;
    client_body_timeout 600s;
    client_header_timeout 600s;

    # Root directory for static files
    root /var/www/geyoutube;

    # Serve static files directly
    location /static/ {
        alias /var/www/geyoutube/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Serve output files (if not using R2)
    location /output/ {
        alias /var/www/geyoutube/output/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy to Flask app
    location / {
        proxy_pass http://geyoutube_backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for video processing
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Connection reuse
        proxy_set_header Connection "";
    }

    # Health check endpoint
    location /health {
        proxy_pass http://geyoutube_backend/health;
        access_log off;
    }
}
